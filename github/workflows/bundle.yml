name: Create One HTML File
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Bundle
        run: |
          npm install
          npm run build
          # Устанавливаем упаковщик, который заменяет ссылки на реальный код
          npm install -g @shovon/inline-assets
          
          # Берем наш HTML и вшиваем в него JS и CSS
          # Мы используем файл из корня, так как судя по твоей структуре он главный
          inline-assets index.html standalone_game.html

      - name: Upload Single File
        uses: actions/upload-artifact@v4
        with:
          name: Mobile_Version_Game
          path: standalone_game.html
