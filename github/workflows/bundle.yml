name: Ultimate Single File Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Game
        run: |
          npm install
          npm run build

      - name: Use SingleFile to bundle everything
        run: |
          # Устанавливаем мощный упаковщик, который имитирует браузер
          npm install -g "single-file-cli"
          
          # Запускаем локальный сервер в фоновом режиме, чтобы упаковщик мог "прочитать" игру
          npx serve . & 
          SLEEP_PID=$!
          sleep 5 # Даем серверу прогрузиться
          
          # Захватываем страницу со всеми подгруженными картинками из JS
          npx single-file http://localhost:3000/index.html standalone_game.html --browser-executable-path /usr/bin/google-chrome --browser-args '["--no-sandbox"]'
          
          kill $SLEEP_PID

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Portable_Tower_Game
          # Указываем путь ТОЛЬКО к одному созданному файлу
          path: standalone_game.html
