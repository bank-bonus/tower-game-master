name: Super Clean Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          npm install
          npm run build

      - name: Create One File
        run: |
          npm install -g inliner
          # Склеиваем index.html и вшиваем JS/Assets
          inliner index.html > my_single_game.html
          
          # ПРОВЕРКА: Удаляем все остальные папки, чтобы GitHub их не видел
          rm -rf assets src dist node_modules package.json index.js index.html

      - name: Upload Only Single HTML
        uses: actions/upload-artifact@v4
        with:
          name: Final_Game_File
          path: my_single_game.html # Теперь он отправит только этот файл
