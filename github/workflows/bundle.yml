name: Build Single HTML Game
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Bundle Everything
        run: |
          npm install -g inliner
          # Проверяем, где лежит скомпилированный HTML
          if [ -f "dist/index.html" ]; then
            TARGET="dist/index.html"
          else
            TARGET="index.html"
          fi
          echo "Использую файл: $TARGET"
          inliner $TARGET > game_standalone.html

      - name: Upload Single File
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Game
          path: game_standalone.html
