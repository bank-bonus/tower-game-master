name: Build Single HTML Game
on:
  push:
    branches: [ main, master ] # Сработает для веток main или master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Project
        run: npm run build # Собирает проект в папку dist

      - name: Inline everything into one file
        run: |
          # Используем npx inliner для склейки dist/index.html в один файл
          npx inliner dist/index.html > index_single.html

      - name: Upload Single HTML
        uses: actions/upload-artifact@v4
        with:
          name: My-Game-Single-File
          path: index_single.html
          if-no-files-found: error
          retention-days: 7
