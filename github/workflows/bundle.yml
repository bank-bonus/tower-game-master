name: Build Single HTML Game
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Inliner & Build
        run: |
          npm install
          npm run build
          npm install -g inliner
          # Определяем входной файл (пробуем dist, если нет - корень)
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            inliner dist/index.html > index_single.html
          else
            inliner index.html > index_single.html
          fi

      - name: Upload ONLY one file
        uses: actions/upload-artifact@v4
        with:
          name: Game_One_File
          # Ключевой момент: путь только к одному файлу!
          path: index_single.html
